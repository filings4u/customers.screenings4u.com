<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Customer Portal Activation | screenings4u</title><link rel="stylesheet" href="/assets/css/portal.css"></head><body class="login-page"><main class="login-card"><img class="login-logo" src="/assets/img/logo.png" alt="screenings4u"><h1 id="heading">Customer Portal Activation</h1><p id="explanation">Checking your secure account activation link.</p><p><a class="btn primary" href="/login.html">Customer Portal Sign In</a></p><p>If you need a new link, choose <strong>Forgot password</strong> on the sign-in page.</p><p><a href="mailto:support@screenings4u.com">Contact support</a></p></main><script>(()=>{'use strict';const query=new URLSearchParams(location.search);const hash=new URLSearchParams(location.hash.slice(1));const error=hash.get('error_code')||hash.get('error')||query.get('error');const token=query.get('token_hash');if(token){const heading=document.getElementById('heading'),explanation=document.getElementById('explanation');const clean=()=>history.replaceState(null,'',location.pathname);heading.textContent='Verifying your activation link';explanation.textContent='Please do not close this page while your secure link is verified.';const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';script.onload=async()=>{try{const config=await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='/assets/js/config.js';s.onload=()=>resolve(window.PORTAL_CONFIG);s.onerror=reject;document.head.append(s)});const sb=window.supabase.createClient(config.supabaseUrl,config.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:window.sessionStorage,storageKey:'s4u-customer-auth'}});const result=await sb.auth.verifyOtp({token_hash:token,type:'recovery'});clean();if(result.error)throw result.error;location.replace('/reset-password.html');}catch(e){clean();heading.textContent='Your activation link cannot be used';explanation.textContent='This secure link has expired or is invalid. Please choose Forgot password on the Customer Portal sign-in page to request a new one.'}};script.onerror=()=>{clean();heading.textContent='Unable to connect';explanation.textContent='Please try again or request a new activation link from the Customer Portal sign-in page.'};document.head.append(script);return}if(args.get('access_token')&&args.get('refresh_token')&&!error){location.replace('/reset-password.html'+location.hash);return}document.getElementById('heading').textContent=error==='otp_expired'?'Your activation link has expired':'Unable to complete activation';document.getElementById('explanation').textContent=error==='otp_expired'?'For your security, this activation link has expired or was already used. Request a new secure link from the Customer Portal sign-in page.':'This link could not be verified. Please request a new secure sign-in link from the Customer Portal.';if(location.hash)history.replaceState(null,'',location.pathname)})();</script></body></html>
